name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Builds every packaged platform (reusing the per-platform build workflows),
# collects their uploaded artifacts, and publishes them to a GitHub Release.
jobs:
  macos:
    uses: ./.github/workflows/build_macos.yml

  windows:
    uses: ./.github/workflows/build_windows.yml

  linux:
    uses: ./.github/workflows/build_linux.yml

  wasm:
    uses: ./.github/workflows/build_wasm.yml

  release:
    name: Publish Release
    needs: [macos, windows, linux, wasm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            artifacts/**/*.pkg
            artifacts/**/*.exe
            artifacts/**/*.tar.gz
            artifacts/**/*.deb

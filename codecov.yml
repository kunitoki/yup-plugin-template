codecov:
  require_ci_to_pass: yes

coverage:
  precision: 2
  round: down
  range: "60...100"

  status:
    project:
      default:
        informational: true
        target: 60%
        threshold: 5%
        base: auto
    patch:
      default:
        informational: true
        target: 60%
        threshold: 5%

component_management:
  default_rules:
    statuses:
      - type: project
        target: auto
        branches:
          - "!main"

  individual_components:
    - component_id: application
      name: "Application Code"
      description: "Main application source code"
      paths:
        - source/**

# Ignore test files, build artifacts, and dependencies
ignore:
  - "tests/**/*"
  - "build/**/*"
  - "cmake/**/*"
  - "packaging/**/*"
  - "**/CMakeFiles/**/*"

# Comment configuration for pull requests
comment:
  layout: "header, reach, diff, flags, files, footer"
  behavior: default
  require_changes: false
